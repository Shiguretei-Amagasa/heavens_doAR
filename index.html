<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ヘブンズ・ドアー AR</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ヘブンズドアー">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#fff}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;text-align:center;font-size:14px;text-shadow:0 0 4px #000,0 0 8px #000;z-index:2;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:2}
button{font:inherit;font-size:15px;padding:12px 16px;border:2px solid #fff;border-radius:10px;background:rgba(0,0,0,.65);color:#fff}
button.main{background:#c0262d;border-color:#fff;font-weight:bold}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#111;text-align:center;padding:24px}
#start h1{margin:0;font-size:26px;letter-spacing:.05em}
#start p{margin:0;font-size:14px;line-height:1.7;color:#ccc}
#telop{position:fixed;left:50%;top:36%;z-index:3;pointer-events:none;white-space:nowrap;font-weight:900;font-size:clamp(26px,8.5vw,52px);color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000;animation:shake .09s infinite}
@keyframes shake{0%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-49%,-51%) rotate(-3deg)}100%{transform:translate(-51%,-50%) rotate(-5deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"></div>
<div id="telop" hidden>何ッ！失敗だと！？</div>
<div id="ui" hidden>
  <button id="cam">カメラ切替</button>
  <button id="say" class="main">ヘブンズドアー</button>
  <button id="close">閉じる</button>
</div>
<div id="start">
  <h1>ヘブンズ・ドアー</h1>
  <p>顔にカメラを向けて<br>「ヘブンズドアー」と言うと<br>顔が本になって今日の運勢が読める。<br>※個人で楽しむ範囲で、相手の了承を得てね。</p>
  <button id="go" class="main">はじめる</button>
</div>

<script type="module">
const FD_BASE="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/";
const loadScript=u=>new Promise((ok,ng)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=()=>ng(new Error("スクリプトを読み込めません"));document.head.appendChild(e);});

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const top_=document.getElementById("top");
const vid=document.createElement("video");vid.playsInline=true;vid.muted=true;vid.setAttribute("playsinline","");vid.setAttribute("muted","");
vid.style.cssText="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";document.body.appendChild(vid);
let cw=0,ch=0,dpr=1,detector=null,facing="environment",mirror=false,stream=null;
let fdReady=false,lmNew=null,sm=null,detBusy=false,face=null,lastSeen=0,book=null,wantSnap=false,lines=[],linesT=0;

const FORTUNES=[
 ["大吉","今日は読むべきページを開け","ラッキー：万年筆"],
 ["吉","小さな偶然を見逃すな","ラッキー：スケッチ帳"],
 ["中吉","人の話にヒントがある","ラッキー：赤いもの"],
 ["小吉","細部にこだわれば運が開く","ラッキー：コーヒー"],
 ["末吉","午後から流れが変わる","ラッキー：古い本"],
 ["吉","ひらめきは散歩中に来る","ラッキー：イヤホン"],
 ["凶","書く前に一呼吸おけ","ラッキー：深呼吸"],
 ["大吉","あなたのリアリティが動かす","ラッキー：黒インク"]
];
const norm=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/\s/g,"");

function resize(){dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;cv.width=cw*dpr;cv.height=ch*dpr;}
addEventListener("resize",resize);resize();

async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  vid.srcObject=stream;await vid.play();mirror=facing==="user";
}

/* --- speech --- */
let rec=null,running=false,lastTrig=0;
function startSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg("音声認識非対応：赤いボタンで発動できます");return;}
  rec=new SR();rec.lang="ja-JP";rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=norm(e.results[i][0].transcript);
      if(/ヘブン[ズス]?ドア|天国の扉|heaven/i.test(t))trigger();
      else if(e.results[i].isFinal)fail();
    }
  };
  rec.onerror=()=>{};
  rec.onend=()=>{if(running)setTimeout(()=>{try{rec.start()}catch{}},300);};
  try{rec.start()}catch{}
}

function msg(t){top_.textContent=t;}
let telopTimer=0;
function fail(){
  if(performance.now()-lastTrig<3500)return; // 発動直後の雑音は無視
  const el=document.getElementById("telop");el.hidden=false;
  clearTimeout(telopTimer);telopTimer=setTimeout(()=>{el.hidden=true;},1800);
}
/* 古紙テクスチャを1回だけ生成 */
function makePaper(w,h,base){
  const o=document.createElement("canvas");o.width=w;o.height=h;const g=o.getContext("2d");
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ // 経年のムラ
    const x=Math.random()*w,y=Math.random()*h,r=20+Math.random()*70,a=.05+Math.random()*.12;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(140,95,40,${a})`);gr.addColorStop(1,"rgba(140,95,40,0)");
    g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  for(let i=0;i<45;i++){ // シミ（フォクシング）
    const x=Math.random()*w,y=Math.random()*h,r=1+Math.random()*3.5;
    g.fillStyle=`rgba(110,70,30,${.25+Math.random()*.35})`;
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  g.lineWidth=.6; // 繊維
  for(let i=0;i<220;i++){
    const x=Math.random()*w,y=Math.random()*h,a=Math.random()*6.28,l=4+Math.random()*12;
    g.strokeStyle=`rgba(100,70,40,${.06+Math.random()*.12})`;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  const id=g.getImageData(0,0,w,h),d=id.data; // ざらつき
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*20;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(id,0,0);
  const v=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.72); // 縁の焼け
  v.addColorStop(0,"rgba(90,55,20,0)");v.addColorStop(1,"rgba(90,55,20,.6)");
  g.fillStyle=v;g.fillRect(0,0,w,h);
  return o;
}
const paperA=makePaper(360,460,"#e8d6a6"),paperB=makePaper(360,460,"#dcc693");
function trigger(){
  if(performance.now()-lastTrig<2500)return;
  if(!face){msg("顔が見つかりません");return;}
  lastTrig=performance.now();wantSnap=true;
}

/* --- drawing --- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function wrap(text,maxW){
  const out=[];let cur="";
  for(const c of text){if(ctx.measureText(cur+c).width>maxW){out.push(cur);cur=c;}else cur+=c;}
  if(cur)out.push(cur);return out;
}

const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const LE=[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466];
const RE=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const MO=[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
function grow(pts,k){let cx=0,cy=0;for(const p of pts){cx+=p[0];cy+=p[1];}cx/=pts.length;cy/=pts.length;return pts.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]);}
function buildFace(m){
  const pick=ix=>ix.map(i=>[m[2*i],m[2*i+1]]);
  const oval=pick(OVAL);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of oval){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  return {x:(x0+x1)/2,y:(y0+y1)/2,w:x1-x0,h:y1-y0,x0,y0,x1,y1,polys:[oval,grow(pick(LE),1.3),grow(pick(RE),1.3),grow(pick(MO),1.12)]};
}
function polyPath(polys,sx,sy){
  ctx.beginPath();
  for(const poly of polys){poly.forEach((p,i)=>i?ctx.lineTo(p[0]*sx,p[1]*sy):ctx.moveTo(p[0]*sx,p[1]*sy));ctx.closePath();}
}

/* 集中線：顔に向かって細くなる針状の線 */
function drawLines(f,now){
  if(now-linesT>90){
    linesT=now;lines=[];
    for(let i=0;i<190;i++)lines.push({a:i/190*Math.PI*2+(Math.random()-.5)*.03,s:Math.random(),l:.7+Math.random()*.45,w:.8+Math.random()*3});
  }
  const far=Math.hypot(cw,ch);
  ctx.save();ctx.translate(f.x,f.y);ctx.fillStyle="#000";
  for(const L of lines){
    const ca=Math.cos(L.a),sa=Math.sin(L.a);
    const rf=Math.hypot(f.w*.5*ca,f.h*.5*sa);
    const r0=rf*(1.2+L.s*.9),r1=Math.max(r0+60,far*L.l);
    const px=-sa*L.w/2,py=ca*L.w/2;
    ctx.beginPath();ctx.moveTo(ca*r0,sa*r0);ctx.lineTo(ca*r1+px,sa*r1+py);ctx.lineTo(ca*r1-px,sa*r1-py);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

/* 顔の形の本：目と口は開けておく／左端を綴じ目に左へ開く */
function drawBook(f,now){
  const W=f.w,H=f.h;
  const t=Math.min((now-book.t0)/1500,1),th=ease(t)*Math.PI;
  // 下のページ（運勢）
  ctx.save();polyPath(f.polys,1,1);ctx.clip("evenodd");
  ctx.drawImage(paperA,f.x0,f.y0,W,H);
  if(t>.5){
    ctx.globalAlpha=Math.min((t-.5)/.3,1);
    const ys=a=>a.map(p=>p[1]);
    const eyeTop=Math.min(...ys(f.polys[1]),...ys(f.polys[2])),eyeBot=Math.max(...ys(f.polys[1]),...ys(f.polys[2]));
    const moTop=Math.min(...ys(f.polys[3])),moBot=Math.max(...ys(f.polys[3]));
    ctx.textAlign="center";ctx.textBaseline="top";
    // 額：今日の運勢＋ランク
    const fy0=f.y0+H*.04,zh=eyeTop-H*.07-fy0;
    if(zh>10){
      const fsT=Math.min(zh*.28,W*.07),fsR=Math.min(zh*.58,W*.2);
      ctx.fillStyle="#3a2814";ctx.font=`${fsT}px serif`;ctx.fillText("今日の運勢",f.x,fy0);
      ctx.fillStyle="#8e2018";ctx.font=`bold ${fsR}px serif`;ctx.fillText(book.fx[0],f.x,fy0+fsT*1.2);
    }
    // 目と口の間：ひとこと
    const my0=eyeBot+H*.012,mh=moTop-H*.012-my0;
    if(mh>8){
      const fs=Math.min(mh/2.3,W*.06);
      ctx.fillStyle="#3a2814";ctx.font=`${fs}px serif`;
      let y=my0+(mh-fs*1.15*Math.min(2,wrap(book.fx[1],W*.55).length))/2;
      for(const ln of wrap(book.fx[1],W*.55).slice(0,2)){ctx.fillText(ln,f.x,y);y+=fs*1.15;}
    }
    // 顎：ラッキーアイテム
    const cy0=moBot+H*.012,zc=f.y1-H*.05-cy0;
    if(zc>8){
      const fs=Math.min(zc*.7,W*.055);
      ctx.fillStyle="#5a3a1c";ctx.font=`${fs}px serif`;ctx.fillText(book.fx[2],f.x,cy0+(zc-fs)/2);
    }
  }
  ctx.restore();
  ctx.strokeStyle="#2a1a0c";ctx.lineWidth=2;ctx.lineJoin="round";polyPath(f.polys,1,1);ctx.stroke();
  // めくれる表面（撮影時の顔の形）
  const s=Math.cos(th);
  ctx.save();ctx.translate(f.x0,f.y0);ctx.scale(s,1);
  ctx.save();polyPath(book.norm,W,H);ctx.clip("evenodd");
  if(th<Math.PI/2){
    ctx.drawImage(book.snap,0,0,W,H);
    ctx.fillStyle=`rgba(90,55,20,${.35*Math.sin(th)})`;ctx.fillRect(0,0,W,H);
  }else{
    ctx.drawImage(paperB,0,0,W,H);
    ctx.globalAlpha=.25;ctx.drawImage(book.snap,0,0,W,H);ctx.globalAlpha=1;
    ctx.strokeStyle="rgba(70,45,20,.22)";ctx.lineWidth=1/Math.max(Math.abs(s),.1);
    for(let i=1;i<14;i++){ctx.beginPath();ctx.moveTo(0,H*i/14);ctx.lineTo(W,H*i/14);ctx.stroke();}
    ctx.fillStyle=`rgba(0,0,0,${.3*Math.sin(th)})`;ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  ctx.strokeStyle="#2a1a0c";ctx.lineWidth=2/Math.max(Math.abs(s),.1);ctx.lineJoin="round";
  polyPath(book.norm,W,H);ctx.stroke();
  ctx.restore();
  // 綴じ目
  ctx.fillStyle="#2a1a0c";ctx.fillRect(f.x0-2,f.y0+H*.2,4,H*.6);
}

function frame(now){
  requestAnimationFrame(frame);
  if(!detector||vid.readyState<2)return;
  const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.max(cw/vw,ch/vh),ox=(cw-vw*s)/2,oy=(ch-vh*s)/2;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();
  if(mirror){ctx.translate(cw,0);ctx.scale(-1,1);}
  ctx.drawImage(vid,ox,oy,vw*s,vh*s);
  ctx.restore();

  // 顔ランドマーク（468点）
  if(!detBusy){detBusy=true;detector.send({image:vid}).catch(()=>{}).finally(()=>{detBusy=false;});}
  if(lmNew){
    const first=!sm;if(first)sm=new Float32Array(468*2);
    for(let i=0;i<468;i++){
      let x=ox+lmNew[i].x*vw*s;if(mirror)x=cw-x;
      const y=oy+lmNew[i].y*vh*s;
      if(first){sm[2*i]=x;sm[2*i+1]=y;}else{sm[2*i]+=(x-sm[2*i])*.55;sm[2*i+1]+=(y-sm[2*i+1])*.55;}
    }
    face=buildFace(sm);lastSeen=now;
  }else if(now-lastSeen>600){face=null;sm=null;}

  if(!face){msg(fdReady?"顔にカメラを向けてください":"顔認識モデルを読み込み中…（初回は数秒かかります）");return;}
  msg(book?"今日の運勢——":"「ヘブンズドアー」と言ってみろ");

  if(wantSnap){ // 発動：顔全体を静止画として切り出し、顔の形も記録
    wantSnap=false;
    const o=document.createElement("canvas");o.width=Math.max(1,face.w*dpr);o.height=Math.max(1,face.h*dpr);
    o.getContext("2d").drawImage(cv,face.x0*dpr,face.y0*dpr,face.w*dpr,face.h*dpr,0,0,o.width,o.height);
    const norm=face.polys.map(poly=>poly.map(p=>[(p[0]-face.x0)/face.w,(p[1]-face.y0)/face.h]));
    book={snap:o,norm,t0:now,fx:FORTUNES[Math.floor(Math.random()*FORTUNES.length)]};
  }
  drawLines(face,now);
  if(book)drawBook(face,now);
}

/* --- boot --- */
const wt=(p,ms,label)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(label+"がタイムアウトしました")),ms))]);
document.getElementById("go").onclick=async()=>{
  const b=document.getElementById("go");b.disabled=true;
  try{
    b.textContent="カメラ起動中…（許可してください）";
    await wt(startCam(),30000,"カメラ起動");
    b.textContent="顔認識エンジン読込中…";
    await wt(loadScript(FD_BASE+"face_mesh.js"),30000,"顔認識エンジンの読込");
    b.textContent="起動中…";
    const fd=new window.FaceMesh({locateFile:f=>FD_BASE+f});
    fd.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
    fd.onResults(r=>{fdReady=true;lmNew=(r.multiFaceLandmarks&&r.multiFaceLandmarks[0])||null;});
    detector=fd;
    document.getElementById("start").hidden=true;document.getElementById("ui").hidden=false;
    running=true;startSpeech();requestAnimationFrame(frame);
  }catch(e){b.disabled=false;b.textContent="はじめる";alert("起動に失敗: "+(e.message||e)+"\n（HTTPSで開き、カメラ/マイクを許可してください）");}
};
document.getElementById("say").onclick=trigger;
document.getElementById("close").onclick=()=>{book=null;};
document.getElementById("cam").onclick=async()=>{facing=facing==="user"?"environment":"user";await startCam();};
</script>
</body>
</html>
